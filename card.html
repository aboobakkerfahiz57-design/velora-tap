
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <title>Aboobakkar Fahiz | Digital Business Card</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 35px 16px;
      font-family: Arial, sans-serif;
      background: #f1f3f6;
      color: #172033;
    }

    .card {
      max-width: 620px;
      margin: auto;
      background: white;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0,0,0,.09);
    }

    .hero {
      background: linear-gradient(135deg, #101827, #263d59);
      color: white;
      padding: 42px 25px 35px;
      text-align: center;
    }

    .photo {
      width: 112px;
      height: 112px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid white;
      background: #dce2e9;
      margin-bottom: 15px;
    }

    h1 { margin: 8px 0; font-size: 27px; }
    .title { color: #d8c18b; font-weight: bold; }
    .bio { line-height: 1.6; color: #e0e6ed; }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 22px;
    }

    .btn {
      display: inline-block;
      padding: 12px 18px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
      border: 0;
      cursor: pointer;
      background: #d8c18b;
      color: #172033;
    }

    .btn.secondary {
      background: white;
      color: #172033;
    }

    .content { padding: 25px; }

    .section { margin-bottom: 27px; }
    h2 { font-size: 19px; margin-bottom: 14px; }

    .company {
      padding: 15px;
      border: 1px solid #e6eaf0;
      border-radius: 12px;
      margin-bottom: 11px;
    }

    .company strong { font-size: 16px; }
    .company p { color: #687386; margin: 7px 0 0; line-height: 1.5; }

    .nested {
      margin: 12px 0 0 12px;
      padding-left: 13px;
      border-left: 2px solid #d8c18b;
    }

    .tag {
      display: inline-block;
      padding: 9px 12px;
      margin: 4px;
      border-radius: 20px;
      background: #f0f2f5;
      font-size: 13px;
    }

    .contact-link {
      display: block;
      padding: 13px;
      margin: 8px 0;
      background: #f5f6f8;
      color: #172033;
      text-decoration: none;
      border-radius: 10px;
      overflow-wrap: anywhere;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #7b8492;
      font-size: 12px;
      border-top: 1px solid #edf0f3;
    }

    .status { text-align: center; padding: 50px 20px; }
  </style>
</head>

<body>
  <main class="card">
    <div id="profile" class="status">Loading digital business card...</div>
  </main>

<script>
const SUPABASE_URL = "https://oxhympbowvttsffrvuwz.supabase.co";
const SUPABASE_KEY = "sb_publishable_k2-dpsZmkOdzRy35_BA4lQ_w6rMCk4S";

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const profile = document.getElementById("profile");
const slug = new URLSearchParams(location.search).get("slug");

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;",
    '"': "&quot;", "'": "&#39;"
  })[char]);
}

function safeURL(value) {
  try {
    const url = new URL(value);
    return ["https:", "http:"].includes(url.protocol) ? url.href : "";
  } catch {
    return "";
  }
}

function renderCompanies(items) {
  if (!Array.isArray(items)) return "";

  return items.map(company => `
    <div class="company">
      <strong>${escapeHTML(company.name)}</strong>
      ${company.description
        ? `<p>${escapeHTML(company.description)}</p>` : ""}
      ${company.companies
        ? `<div class="nested">${renderCompanies(company.companies)}</div>`
        : ""}
    </div>
  `).join("");
}

function makeContact(data) {
  const phone = data.phone || data.whatsapp_number || "";
  const vcard = [
    "BEGIN:VCARD",
    "VERSION:3.0",
    `FN:${data.full_name || ""}`,
    `TITLE:${data.job_title || ""}`,
    phone ? `TEL:${phone}` : "",
    data.email ? `EMAIL:${data.email}` : "",
    data.website_url ? `URL:${data.website_url}` : "",
    "END:VCARD"
  ].filter(Boolean).join("\r\n");

  const blob = new Blob([vcard], { type: "text/vcard" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "Aboobakkar-Fahiz.vcf";
  link.click();
  URL.revokeObjectURL(url);
}

function renderCard(data) {
  const whatsapp = (data.whatsapp_number || "").replace(/\D/g, "");
  const website = safeURL(data.website_url);
  const photo = safeURL(data.photo_url);

  const social = Object.entries(data.social_links || {})
    .map(([name, url]) => {
      const safe = safeURL(url);
      return safe
        ? `<a class="contact-link" href="${escapeHTML(safe)}" target="_blank" rel="noopener">${escapeHTML(name)}</a>`
        : "";
    }).join("");

  profile.className = "";

  profile.innerHTML = `
    <header class="hero">
      ${photo
        ? `<img class="photo" src="${escapeHTML(photo)}" alt="Profile photo">`
        : ""}
      <h1>${escapeHTML(data.full_name)}</h1>
      <div class="title">${escapeHTML(data.job_title)}</div>
      <p class="bio">${escapeHTML(data.bio)}</p>

      <div class="actions">
        <button class="btn" id="saveContact">Save Contact</button>
        ${data.phone
          ? `<a class="btn secondary" href="tel:${escapeHTML(data.phone)}">Call</a>` : ""}
        ${whatsapp
          ? `<a class="btn secondary" href="https://wa.me/${whatsapp}" target="_blank" rel="noopener">WhatsApp</a>` : ""}
        ${data.email
          ? `<a class="btn secondary" href="mailto:${escapeHTML(data.email)}">Email</a>` : ""}
        ${website
          ? `<a class="btn secondary" href="${escapeHTML(website)}" target="_blank" rel="noopener">Website</a>` : ""}
      </div>
    </header>

    <div class="content">
      <section class="section">
        <h2>Company Portfolio</h2>
        ${renderCompanies(data.companies)}
      </section>

      <section class="section">
        <h2>Services</h2>
        ${(Array.isArray(data.services) ? data.services : [])
          .map(item => `<span class="tag">${escapeHTML(item)}</span>`).join("")}
      </section>

      <section class="section">
        <h2>Contact & Social Links</h2>
        ${data.email
          ? `<a class="contact-link" href="mailto:${escapeHTML(data.email)}">✉ ${escapeHTML(data.email)}</a>` : ""}
        ${whatsapp
          ? `<a class="contact-link" href="https://wa.me/${whatsapp}" target="_blank" rel="noopener">WhatsApp</a>` : ""}
        ${website
          ? `<a class="contact-link" href="${escapeHTML(website)}" target="_blank" rel="noopener">Visit Website</a>` : ""}
        ${social}
      </section>
    </div>

    <footer>Digital Business Card · Powered by VELORA TAP</footer>
  `;

  document.getElementById("saveContact").addEventListener("click", () => {
    makeContact(data);
  });
}

async function loadCard() {
  if (!slug) {
    profile.textContent = "No digital card was specified.";
    return;
  }

  const { data, error } = await db
    .from("personal_digital_cards")
    .select("*")
    .eq("slug", slug)
    .eq("is_published", true)
    .maybeSingle();

  if (error) {
    console.error(error);
    profile.textContent = "Could not load the digital card. Please try again later.";
    return;
  }

  if (!data) {
    profile.textContent = "This digital card is not available or has not been published.";
    return;
  }

  document.title = `${data.full_name} | Digital Business Card`;
  renderCard(data);
}

loadCard();
</script>
</body>
</html>
