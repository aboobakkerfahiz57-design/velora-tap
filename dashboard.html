
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VELORA TAP | Admin Dashboard</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background:#080808; }
    .dashboard { max-width:1200px; margin:auto; padding:35px 5%; }
    .dash-top { display:flex; justify-content:space-between; align-items:center; gap:15px; flex-wrap:wrap; margin-bottom:30px; }
    .dash-top h1 { color:#e7ca88; font-size:30px; }
    .dash-panel { background:#111; border:1px solid rgba(201,164,92,.25); border-radius:10px; padding:25px; margin-bottom:25px; }
    .dash-panel h2 { margin-bottom:20px; color:#e7ca88; }
    .business-form { display:grid; grid-template-columns:repeat(2,1fr); gap:16px; }
    .business-form label { display:block; color:#aaa; font-size:13px; margin-bottom:7px; }
    .business-form input, .business-form textarea, .business-form select {
      width:100%; padding:12px; background:#080808; border:1px solid #333;
      border-radius:5px; color:white; outline:none;
    }
    .business-form input:focus, .business-form textarea:focus { border-color:#c9a45c; }
    .full { grid-column:1/-1; }
    .form-actions { display:flex; gap:10px; flex-wrap:wrap; }
    .secondary-button, .danger-button {
      padding:12px 18px; border-radius:4px; cursor:pointer; font-weight:600;
    }
    .secondary-button { background:#222; color:#e7ca88; border:1px solid #c9a45c; }
    .danger-button { background:#3a1515; color:#ffaaaa; border:1px solid #713333; }
    .business-list { display:grid; gap:14px; }
    .business-item { padding:18px; background:#191919; border:1px solid #333; border-radius:7px; display:flex; justify-content:space-between; align-items:center; gap:15px; flex-wrap:wrap; }
    .business-info h3 { color:white; margin-bottom:5px; }
    .business-info p { color:#999; font-size:13px; }
    .business-actions { display:flex; gap:8px; flex-wrap:wrap; }
    .business-actions button { padding:9px 12px; cursor:pointer; border-radius:4px; border:1px solid #555; background:#222; color:white; }
    .status-active { color:#8ee0a5; }
    .status-inactive { color:#ff9999; }
    #dash-message { margin:15px 0; color:#e7ca88; }
    .empty-state { color:#999; padding:20px 0; }
    @media(max-width:650px) {
      .business-form { grid-template-columns:1fr; }
      .full { grid-column:auto; }
      .dash-panel { padding:18px; }
    }
  </style>
</head>
<body>

<header class="site-header">
  <a href="index.html" class="brand">
    <span class="brand-mark">V</span>
    <span>VELORA <strong>TAP</strong></span>
  </a>
  <button id="logout-button" class="secondary-button">Logout</button>
</header>

<main class="dashboard">
  <div class="dash-top">
    <div>
      <p class="eyebrow">CONTROL CENTRE</p>
      <h1>Admin Dashboard</h1>
      <p style="color:#999">Manage your VELORA TAP business profiles.</p>
    </div>
  </div>

  <section class="dash-panel">
    <h2 id="form-heading">Add New Business</h2>

    <form id="business-form" class="business-form">
      <input type="hidden" id="business-id">

      <div>
        <label for="business-name">Business Name *</label>
        <input id="business-name" required maxlength="120" placeholder="Example: ABC Restaurant">
      </div>

      <div>
        <label for="business-slug">Unique Page Slug *</label>
        <input id="business-slug" required pattern="[a-z0-9-]+" maxlength="80" placeholder="abc-restaurant">
      </div>

      <div class="full">
        <label for="business-description">Description</label>
        <textarea id="business-description" rows="3" maxlength="500" placeholder="About this business"></textarea>
      </div>

      <div>
        <label for="business-logo">Business Logo</label>
        <input id="business-logo" type="file" accept="image/png,image/jpeg,image/webp">
      </div>

      <div>
        <label for="business-status">Status</label>
        <select id="business-status">
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
        </select>
      </div>

      <div>
        <label for="google-link">Google Review URL</label>
        <input id="google-link" type="url" placeholder="https://g.page/r/...">
      </div>

      <div>
        <label for="website-link">Website URL</label>
        <input id="website-link" type="url" placeholder="https://example.com">
      </div>

      <div>
        <label for="whatsapp-number">WhatsApp Number</label>
        <input id="whatsapp-number" type="tel" placeholder="919876543210">
      </div>

      <div>
        <label for="instagram-link">Instagram URL</label>
        <input id="instagram-link" type="url" placeholder="https://instagram.com/example">
      </div>

      <div class="full form-actions">
        <button type="submit" class="primary-button" id="save-business">Save Business</button>
        <button type="button" class="secondary-button" id="reset-form">Clear Form</button>
      </div>
    </form>

    <p id="dash-message" role="status"></p>
  </section>

  <section class="dash-panel">
    <h2>Business Profiles</h2>
    <div id="business-list" class="business-list">
      <p class="empty-state">Loading businesses...</p>
    </div>
  </section>
</main>

<script src="config.js"></script>
<script>
(async function () {
  const db = window.supabaseClient;
  const message = document.getElementById("dash-message");
  const form = document.getElementById("business-form");
  const list = document.getElementById("business-list");
  const saveButton = document.getElementById("save-business");

  function notify(text, error = false) {
    message.textContent = text;
    message.style.color = error ? "#ff8888" : "#e7ca88";
  }

  if (!db) {
    notify("Supabase configuration not found.", true);
    return;
  }

  // Verify signed-in admin
  const { data: authData, error: authError } = await db.auth.getUser();

  if (authError || !authData.user) {
    window.location.replace("index.html");
    return;
  }

  const user = authData.user;

  const { data: profile, error: profileError } = await db
    .from("admin_profiles")
    .select("is_admin")
    .eq("user_id", user.id)
    .single();

  if (profileError || !profile || profile.is_admin !== true) {
    await db.auth.signOut();
    window.location.replace("index.html");
    return;
  }

  let businesses = [];

  function resetForm() {
    form.reset();
    document.getElementById("business-id").value = "";
    document.getElementById("form-heading").textContent = "Add New Business";
    saveButton.textContent = "Save Business";
  }

  document.getElementById("reset-form").addEventListener("click", resetForm);

  function createButton(label, action, danger = false) {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = label;
    if (danger) button.classList.add("danger-button");
    button.addEventListener("click", action);
    return button;
  }

  async function loadBusinesses() {
    list.replaceChildren();
    list.textContent = "Loading businesses...";

    const { data, error } = await db
      .from("businesses")
      .select("*")
      .order("created_at", { ascending: false });

    if (error) {
      list.textContent = "Unable to load businesses: " + error.message;
      return;
    }

    businesses = data || [];
    list.replaceChildren();

    if (!businesses.length) {
      const empty = document.createElement("p");
      empty.className = "empty-state";
      empty.textContent = "No business profiles yet. Add your first business above.";
      list.appendChild(empty);
      return;
    }

    businesses.forEach((business) => {
      const item = document.createElement("article");
      item.className = "business-item";

      const info = document.createElement("div");
      info.className = "business-info";

      const name = document.createElement("h3");
      name.textContent = business.name;

      const slug = document.createElement("p");
      slug.textContent = "Page: " + business.slug;

      const status = document.createElement("p");
      status.textContent = business.status.toUpperCase();
      status.className = business.status === "active" ? "status-active" : "status-inactive";

      info.append(name, slug, status);

      const actions = document.createElement("div");
      actions.className = "business-actions";

      actions.appendChild(createButton("Edit", () => editBusiness(business)));

      actions.appendChild(createButton(
        business.status === "active" ? "Deactivate" : "Activate",
        () => toggleStatus(business)
      ));

      actions.appendChild(createButton(
        "Copy URL",
        () => copyBusinessUrl(business.slug)
      ));

      actions.appendChild(createButton(
        "Delete",
        () => deleteBusiness(business),
        true
      ));

      item.append(info, actions);
      list.appendChild(item);
    });
  }

  async function uploadLogo(file, businessId) {
    if (!file) return null;

    if (!["image/png", "image/jpeg", "image/webp"].includes(file.type)) {
      throw new Error("Choose a PNG, JPG or WebP image.");
    }

    if (file.size > 2 * 1024 * 1024) {
      throw new Error("Logo must be smaller than 2 MB.");
    }

    const extension = file.name.split(".").pop().toLowerCase();
    const path = businessId + "/" + crypto.randomUUID() + "." + extension;

    const { error } = await db.storage
      .from("business-logos")
      .upload(path, file, { upsert: true });

    if (error) throw error;

    const { data } = db.storage
      .from("business-logos")
      .getPublicUrl(path);

    return data.publicUrl;
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    saveButton.disabled = true;

    try {
      notify("Saving business...");

      const id = document.getElementById("business-id").value || crypto.randomUUID();
      const logoFile = document.getElementById("business-logo").files[0];

      const existing = businesses.find((b) => b.id === id);
      let logoUrl = existing?.logo_url || null;

      if (logoFile) {
        logoUrl = await uploadLogo(logoFile, id);
      }

      const record = {
        name: document.getElementById("business-name").value.trim(),
        slug: document.getElementById("business-slug").value.trim().toLowerCase(),
        description: document.getElementById("business-description").value.trim() || null,
        logo_url: logoUrl,
        google_review_url: document.getElementById("google-link").value.trim() || null,
        website_url: document.getElementById("website-link").value.trim() || null,
        whatsapp_number: document.getElementById("whatsapp-number").value.trim() || null,
        instagram_url: document.getElementById("instagram-link").value.trim() || null,
        status: document.getElementById("business-status").value
      };

      let result;

      if (existing) {
        result = await db.from("businesses").update(record).eq("id", id);
      } else {
        result = await db.from("businesses").insert({ id, ...record });
      }

      if (result.error) throw result.error;

      notify("Business saved successfully!");
      resetForm();
      await loadBusinesses();

    } catch (error) {
      notify(error.message || "Unable to save business.", true);
    } finally {
      saveButton.disabled = false;
    }
  });

  function editBusiness(business) {
    document.getElementById("business-id").value = business.id;
    document.getElementById("business-name").value = business.name || "";
    document.getElementById("business-slug").value = business.slug || "";
    document.getElementById("business-description").value = business.description || "";
    document.getElementById("google-link").value = business.google_review_url || "";
    document.getElementById("website-link").value = business.website_url || "";
    document.getElementById("whatsapp-number").value = business.whatsapp_number || "";
    document.getElementById("instagram-link").value = business.instagram_url || "";
    document.getElementById("business-status").value = business.status || "active";
    document.getElementById("form-heading").textContent = "Edit Business";
    saveButton.textContent = "Update Business";
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  async function toggleStatus(business) {
    const nextStatus = business.status === "active" ? "inactive" : "active";

    const { error } = await db
      .from("businesses")
      .update({ status: nextStatus })
      .eq("id", business.id);

    if (error) {
      notify(error.message, true);
      return;
    }

    notify("Business status updated.");
    await loadBusinesses();
  }

  async function deleteBusiness(business) {
    if (!confirm("Permanently delete " + business.name + "?")) return;

    const { error } = await db
      .from("businesses")
      .delete()
      .eq("id", business.id);

    if (error) {
      notify(error.message, true);
      return;
    }

    notify("Business deleted.");
    await loadBusinesses();
  }

  async function copyBusinessUrl(slug) {
    const url = new URL("/" + encodeURIComponent(slug), window.location.origin).href;

    try {
      await navigator.clipboard.writeText(url);
      notify("Business URL copied: " + url);
    } catch {
      notify("Copy unavailable. URL: " + url);
    }
  }

  document.getElementById("logout-button").addEventListener("click", async () => {
    await db.auth.signOut();
    window.location.replace("index.html");
  });

  await loadBusinesses();
})();
</script>
</body>
</html>
